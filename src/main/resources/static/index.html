
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>
        <h1>My Cloud Task Manager - CI/CD Demo</h1>
        <p>Organize your work and stay productive.</p>
    </header>

    <section class="stats">
        <div class="stat-card">
            <h3>Total Tasks</h3>
            <p id="totalTasks">0</p>
        </div>

        <div class="stat-card">
            <h3>Completed</h3>
            <p id="completedTasks">0</p>
        </div>

        <div class="stat-card">
            <h3>Pending</h3>
            <p id="pendingTasks">0</p>
        </div>
    </section>

    <section class="task-form">
        <h2>Add New Task</h2>

        <input type="text" id="title"
               placeholder="Enter task title">

        <textarea id="description"
                  placeholder="Enter task description"></textarea>

        <button onclick="addTask()">Add Task</button>
    </section>

    <section class="task-section">
        <h2>My Tasks</h2>
        <div id="taskList"></div>
    </section>

</div>

<script src="script.js"></script>
</body>
</html>
